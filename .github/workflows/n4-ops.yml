name: N4 OPS

# Offline N4 maintenance tooling only. Kept separate from ci.yml, which is part of the frozen
# N4 implementation identity. No Cloudflare credentials, deployment or request execution.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  n4-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/tsx/dist/cli.mjs --test tests/n4-ops-01.test.ts
